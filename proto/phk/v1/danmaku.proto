// ============================ 消息定义 ============================

// 场地与节拍元信息。
message DanmakuFieldSpec {
  uint32 width = 1;         // 640
  uint32 height = 2;        // 960
  uint32 half_width = 3;    // 320
  uint32 half_height = 4;   // 480
  uint32 tick_rate_hz = 5;  // 60
}

// 一次敌机齐射指令，严格对应原版 96 字节 Enemy::CreateBulletCommand（28 字段）。
// 字段号 = 原版结构体偏移顺序（+0..+94）。整数 int16 字段在协议中用 int32 承载。
// 注意：本结构保留原版 float 布局以求逐字节保真；服务端权威坐标的整数 milli 约定
// 仅用于 DanmakuBulletState 与快照，不改变此发射指令。
message BulletSpawnCommand {
  int32 bullet_type = 1;       // +0  BulletKind 值（原版 kEnemyBullet 枚举值，9..224）
  int32 frame_index = 2;       // +4  图集帧号
  float spawn_x = 3;           // +8  -1.0 = 跟随发射者 X（哨兵）
  float spawn_y = 4;           // +12 -1.0 = 跟随发射者 Y（哨兵）
  bool flag16 = 5;             // +16 透传 spriteWithFile 第 5 参
  float base_angle_deg = 6;    // +20 基础角度（度）
  float f24 = 7;               // +24 透传
  float f28 = 8;               // +28 透传
  float f32 = 9;               // +32 透传
  float f36 = 10;              // +36 透传
  float f40 = 11;              // +40 透传
  int32 count = 12;            // +44 本次发射数量（0 -> 直接返回）
  float spread_or_speed = 13;  // +48 张角/速度（参与起始角计算）
  int32 s52 = 14;              // +52 透传 spriteWithFile p11
  int32 s54 = 15;              // +54 透传 p12
  int32 s56 = 16;              // +56 透传 p13
  float f60 = 17;              // +60 透传 p14
  float f64 = 18;              // +64 透传 p15
  float f68 = 19;              // +68 透传 p16
  float f72 = 20;              // +72 透传 p17
  float f76 = 21;              // +76 透传 p18
  float f80 = 22;              // +80 透传 p19
  int32 s84 = 23;              // +84 透传 p20
  int32 s86 = 24;              // +86 透传 p21
  int32 s88 = 25;              // +88 透传 p22
  int32 s90 = 26;              // +90 透传 p23
  int32 s92 = 27;              // +92 透传 p24
  int32 s94 = 28;              // +94 透传 p25
}

// 一个 tick 内的整批齐射（BATTLE_PAYLOAD_TYPE_DANMAKU_SPAWN 的载荷）。
// createBullets1 语义：整圆径向发射器，angleStep = 360.0/count，
// 起始角 = baseAngle - spread，负值归一化 +360。
message DanmakuSpawnBatch {
  uint64 tick = 1;
  uint32 pattern_index = 2;    // 确定性 RNG 输入之一
  uint32 spawn_index = 3;      // 确定性 RNG 输入之一
  string owner_enemy_id = 4;
  repeated BulletSpawnCommand commands = 5;
}

// 运行期子弹状态（服务端权威；坐标/速度用整数 milli = 1/1000 px）。
message DanmakuBulletState {
  string bullet_id = 1;
  BulletKind bullet_kind = 2;
  BulletMotion motion = 3;
  int32 x_milli = 4;
  int32 y_milli = 5;
  int32 vx_milli = 6;
  int32 vy_milli = 7;
  uint32 life_ticks = 8;
  uint32 radius_milli = 9;
  uint32 age_ticks = 10;
  uint32 func_state = 11;      // 原版 EnemyBullet+0x5B4 状态号（bulletFunc 分派键，1..85）
  float angle_deg = 12;        // 当前朝向（度）
  string owner_enemy_id = 13;
}

// Boss 阶段时间线的一个构造批次（对应 setBossBullet* 内 frame % PERIOD == PHASE 的一个块）。
message DanmakuTimelineEntry {
  uint32 phase = 1;            // 阶段字段 Enemy+0x534
  uint32 sub_phase = 2;        // 子阶段 Enemy+0x6f8
  uint32 sub_phase_2 = 3;      // 子阶段 Enemy+0x670
  uint32 period_ticks = 4;     // frame % period_ticks
  uint32 phase_offset = 5;     // == phase_offset 时触发
  uint32 node_size_bytes = 6;  // 节点尺寸（#11=0x40，#12=0x80）
  uint32 bullet_count = 7;     // 节点 +0x24 发射数
  uint32 pattern_node_id = 8;  // 节点 +0x28 模式 id（如 0xfa=250 / 0x32=50）
  float base_angle_deg = 9;
  float spread_deg = 10;
  BulletKind bullet_kind = 11;
  BulletMotion motion = 12;
  uint32 sound_effect_id = 13;
  string angle_expr = 14;      // 原始角度表达式（未静态解析时保留）
  string offset_expr = 15;     // 原始偏移表达式
}

// 一个 Boss 的弹幕时间线（对应原版 setBossBulletNN / setBossBulletPatchou）。
message BossPhasePattern {
  string pattern_id = 1;         // 如 "setBossBullet11"
  uint32 boss_index = 2;         // 11..22；Patchou 用 0
  uint32 phase_field_offset = 3; // 主阶段字段偏移，如 0x534
  string source_addr = 4;        // 原版函数地址
  repeated DanmakuTimelineEntry entries = 5;
  string notes = 6;
}

// 自机射击规格（对应 MyShip::createBullets<Chara><A|B><N>）。
message PlayerShotSpec {
  string name = 1;                        // 如 "ReimuA1"
  string character = 2;                   // 如 "Reimu"
  string mode = 3;                        // "A" / "B"
  uint32 variant = 4;                     // 1 / 2
  uint32 volley_count = 5;                // 每轮发数
  repeated PlayerBulletType bullet_types = 6;  // 逐发 kMyBullet 值
  repeated float angles_deg = 7;          // 逐发角度（度）
  float speed = 8;                        // 逐发速度（未解析时为 0）
  string muzzle_expr = 9;                 // 炮口偏移原始表达式
  bool resolved = 10;                     // 是否已完整静态解析（false 表示含循环生成/未捕获项）
  string raw_angle = 11;                  // 原始 angle 字段
  string raw_speed = 12;                  // 原始 speed 字段
  string raw_tex_type = 13;               // 原始 tex_type 字段
  string raw_volley = 14;                 // 原始 volley 字段
}

// 自机炸弹规格（对应 MyShip::createBomb<Chara>）。
message PlayerBombSpec {
  string name = 1;                        // 如 "createBombReimu"
  string character = 2;
  uint32 total_frames = 3;                // #1368 bombRemainTime（炸弹总时长）
  uint32 invuln_frames = 4;               // #1372 bombMutekiCnt（无敌帧）
  uint32 bullet_count = 5;                // 激活时生成的 MyBomb 数
  repeated PlayerBulletType bullet_types = 6;
  repeated string sprites = 7;            // mybomb_* 贴图名
  string notes = 8;
}

// 一份完整自机 loadout（52 射击 + 13 炸弹）。
message DanmakuLoadout {
  repeated PlayerShotSpec shots = 1;
  repeated PlayerBombSpec bombs = 2;
}
