name: Protocol Schema Audit

on:
  pull_request:
    paths:
      - "proto/**"
      - "schemas/**"
      - "fixtures/**"
      - "descriptors/**"
      - "gen/**"
      - "tools/**"
      - ".github/workflows/protocol-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhK-Protocol
        uses: actions/checkout@v4
      - name: Regenerate descriptor and manifests
        run: |
          python3 tools/export_descriptor.py
          python3 tools/export_go_manifest.py
          python3 tools/export_cpp_manifest.py
      - name: Run protocol checker
        run: python3 tools/check_protocol.py
      - name: Check generated files and whitespace
        run: |
          git diff --exit-code
          git diff --check HEAD
