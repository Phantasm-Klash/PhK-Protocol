syntax = "proto3";

package phk.v1;

option go_package = "github.com/phantasm-klash/phk-protocol/gen/go/phk/v1;phkv1";

import "phk/v1/common.proto";
import "phk/v1/matchmaking.proto";

enum LobbyMessageType {
  LOBBY_MESSAGE_TYPE_UNSPECIFIED = 0;
  LOBBY_MESSAGE_TYPE_AUTH_REQUEST = 1;
  LOBBY_MESSAGE_TYPE_AUTH_RESPONSE = 2;
  LOBBY_MESSAGE_TYPE_BOOTSTRAP_REQUEST = 3;
  LOBBY_MESSAGE_TYPE_BOOTSTRAP_RESPONSE = 4;
  LOBBY_MESSAGE_TYPE_ROOM_CREATE_REQUEST = 5;
  LOBBY_MESSAGE_TYPE_ROOM_CREATE_RESPONSE = 6;
  LOBBY_MESSAGE_TYPE_ROOM_JOIN_REQUEST = 7;
  LOBBY_MESSAGE_TYPE_ROOM_JOIN_RESPONSE = 8;
  LOBBY_MESSAGE_TYPE_ROOM_LEAVE_REQUEST = 9;
  LOBBY_MESSAGE_TYPE_ROOM_STATE = 10;
  LOBBY_MESSAGE_TYPE_MATCH_START = 11;
  LOBBY_MESSAGE_TYPE_MATCH_RESULT = 12;
}

message LobbyPlayerProfile {
  string user_id = 1;
  string player_id = 2;
  string display_name = 3;
  string character_id = 4;
  uint32 level = 5;
  string rating_code = 6;
  LoadoutRef loadout = 7;
}

message LobbyPlayer {
  string user_id = 1;
  string player_id = 2;
  string display_name = 3;
  bool ready = 4;
  bool host = 5;
  bool connected = 6;
  string character_id = 7;
  LoadoutRef loadout = 8;
}

message LobbyAuthRequest {
  VersionStamp version = 1;
  string session_token = 2;
  string user_id = 3;
  string platform = 4;
  string client_build = 5;
}

message LobbyAuthResponse {
  VersionStamp version = 1;
  string session_token = 2;
  string user_id = 3;
  string player_id = 4;
  int64 issued_at_ms = 5;
  int64 expires_at_ms = 6;
  ErrorStatus error = 7;
}

message LobbyBootstrapRequest {
  VersionStamp version = 1;
  string session_token = 2;
  string user_id = 3;
  string known_ruleset_version = 4;
}

message LobbyBootstrapResponse {
  VersionStamp version = 1;
  LobbyPlayerProfile profile = 2;
  string ruleset_version = 3;
  repeated string unlocked_character_ids = 4;
  map<string, string> server_flags = 5;
  ErrorStatus error = 6;
}

message RoomCreateRequest {
  VersionStamp version = 1;
  string room_code = 2;
  string mode_id = 3;
  string host_user_id = 4;
  LoadoutRef loadout = 5;
  map<string, string> mode_params = 6;
}

message RoomCreateResponse {
  VersionStamp version = 1;
  string room_code = 2;
  string mode_id = 3;
  string host_user_id = 4;
  RoomStateMessage room = 5;
  ErrorStatus error = 6;
}

message RoomJoinRequest {
  VersionStamp version = 1;
  string room_code = 2;
  string user_id = 3;
  string player_id = 4;
  LoadoutRef loadout = 5;
}

message RoomJoinResponse {
  VersionStamp version = 1;
  string room_code = 2;
  string mode_id = 3;
  string host_user_id = 4;
  repeated LobbyPlayer players = 5;
  RoomStateMessage room = 6;
  ErrorStatus error = 7;
}

message RoomLeaveRequest {
  VersionStamp version = 1;
  string room_code = 2;
  string user_id = 3;
  string player_id = 4;
  string reason = 5;
}

message RoomStateMessage {
  VersionStamp version = 1;
  string room_code = 2;
  string host_user_id = 3;
  repeated LobbyPlayer players = 4;
  string mode_id = 5;
  bool all_ready = 6;
  string ruleset_version = 7;
  map<string, string> mode_params = 8;
}

message MatchStartMessage {
  VersionStamp version = 1;
  string match_id = 2;
  bytes server_seed = 3;
  string battle_server_id = 4;
  string endpoint = 5;
  SignedBattleTicket signed_battle_ticket = 6;
  string ruleset_version = 7;
  string mode_id = 8;
  repeated string player_ids = 9;
  int64 started_at_ms = 10;
}

message MatchResultMessage {
  VersionStamp version = 1;
  string match_id = 2;
  string winner_player_id = 3;
  map<string, int32> points = 4;
  string replay_id = 5;
  bool server_authoritative = 6;
  string mode_id = 7;
  int64 settled_at_ms = 8;
}
