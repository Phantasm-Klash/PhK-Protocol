// 千夜追忆 (Touhou: Thousand Night Anamnesis) 1.40 弹幕契约 —— 逆向成果的正式协议落点。
//
// 版权/用途声明：本文件由对东方 Project 同人作品《千夜追忆》1.40 的静态逆向成果移植而来，
// 仅用于自研玩法的服务端权威模拟，不包含任何原版美术/音频二进制资源。
//
// 关键约定（实测，详见 docs/danmaku_contract.md 与 rev/patterns/）：
//   1. 角度单位一律为「度」(degree)，不是弧度。原版 0xace18c = 57.29578 为 度↔弧度 换算常量。
//   2. 发射位置 spawn_x/spawn_y == -1.0 为哨兵，表示「跟随发射者坐标」。
//   3. BulletKind 数值 = 原版 kEnemyBullet 枚举值（9..224），客户端用它索引图集帧；此处不重编号。
//   4. 服务端权威运行期坐标用整数 milli（1/1000 px），沿用 BossRaceBullet 风格。
//   5. 确定性 RNG 输入 = (match_seed, tick, pattern_index, spawn_index)，禁用系统时间/帧率。
//   6. 场地 640x960（半宽 320 / 半高 480），逻辑帧率 60 Hz。

